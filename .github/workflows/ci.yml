name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fast plain-Go checks: formatting, vet, tidiness, and that the plugin
  # compiles against the released vinculum module.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check go.mod/go.sum are tidy
        run: go mod tidy -diff

      - name: Build plugin (.so)
        run: go build -buildmode=plugin -o example.so .

  # End-to-end smoke test. Go plugins require cgo (-buildmode=plugin needs
  # external linking) and the .so must match the host binary's toolchain
  # and cgo/build state exactly, so we build BOTH the host binary and the
  # plugin here on the runner with the default cgo-enabled settings.
  #
  # GOTOOLCHAIN=local pins both builds to the toolchain set up below (from
  # go.mod) and prevents `go install` from silently upgrading to a newer
  # patch release for the host only, which would produce an ABI mismatch
  # (e.g. "plugin was built with a different version of package
  # internal/godebugs"). The host is installed from the same released
  # vinculum version the plugin compiles against.
  smoke:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine vinculum version
        id: ver
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/tsarna/vinculum)
          echo "Using vinculum $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install matching vinculum host binary
        run: go install github.com/tsarna/vinculum@${{ steps.ver.outputs.version }}

      - name: Build plugin (.so)
        run: |
          mkdir -p plugins
          go build -buildmode=plugin -o plugins/example.so .

      - name: Smoke test (host loads plugin + validates config)
        run: |
          "$(go env GOPATH)/bin/vinculum" check --plugin-path plugins examples/

  # One check for branch protection to require, instead of naming this
  # workflow's jobs: the gate is *handed* their results, so adding, renaming or
  # splitting a job here never means editing a protection rule again. It is also
  # where a red Renovate PR is handed to a Devin session -- a sibling job, never
  # a dependency of the gate, so it cannot affect this check's conclusion.
  # Definition and the full list of handoff preconditions: tsarna/ci-shared.
  #
  # All four permissions are required even though only the handoff uses them:
  # GitHub checks statically that no job in a called workflow requests more than
  # the caller grants, and fails the whole run at startup if one does -- skipped
  # jobs included.
  ci-success:
    name: CI Success
    if: always()
    needs: [build, smoke]
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    # Pinned by commit, as a moving tag here would let anyone who could push one
    # to ci-shared run code in every calling repo. Renovate keeps it current
    # from the trailing version comment.
    uses: tsarna/ci-shared/.github/workflows/ci-gate.yml@85244f4e73be1b93e928818027f8dee55e4e8006 # v1.2.0
    with:
      needs: ${{ toJSON(needs) }}
